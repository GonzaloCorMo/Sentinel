site_name: HPE Ambulancia Digital Twin Docs
site_description: Documentacion tecnica del proyecto HPE CDS.
site_url: http://localhost:3001
docs_dir: pages

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Introduccion: intro.md
  - Getting Started:
      - Levantar proyecto: getting-started/levantar-proyecto.md
      - Arranque con Docker: getting-started/docker.md
      - Probar PWA en móvil: getting-started/pwa-mobile.md
  - Auth:
      - Supabase fase 1: auth/supabase-auth-fase-1.md
  - Arquitectura:
      - Vue + FastAPI: arquitectura/arquitectura-hibrida-ts-python.md
      - Contratos operativos: arquitectura/contratos-operativos-next-python.md
  - Technical:
      - Base de datos: technical/base-de-datos.md
      - OSRM multi-region: technical/osrm-local-docker.md
      - API simulacion HTTP SSE: technical/simulation-api-http-sse.md
      - Aruba Pulse Kafka: technical/aruba-pulse-kafka.md
      - Trazabilidad tecnica: technical/trazabilidad-tecnica.md
      - Runbook resiliencia: technical/runbook-resiliencia-operativa.md
      - IA Chatbot RAG: technical/ai-chatbot-rag.md
      - IA HITL y Autonomo: technical/ai-hitl-autonomo.md
  - ML Training:
      - Pipeline de entrenamiento: ml/pipeline-entrenamiento.md
      - Modo simulacion autonoma: ml/modo-simulacion-autonoma.md
      - Tiempo de entrenamiento: ml/tiempo-entrenamiento.md
      - Usar modelo entrenado: ml/usar-modelo-entrenado.md
      - Proyecto paralelo hpe-ml-training: ml/proyecto-paralelo-ml-training.md
  - Guia de usuario:
      - Manual de uso: guia-usuario/manual-de-uso.md
      - Chatbot IA: guia-usuario/chatbot-ia.md
      - Operacion real despacho: guia-usuario/operacion-real-despacho.md
      - Simulador global despacho: technical/simulador-global-despacho.md
      - Simulador mapa velocidad: technical/simulador-mapa-velocidad.md
