# Arranque (elige perfil GPU según hardware del host para Ollama embeddings):
#   docker compose --profile gpu-nvidia up -d   # RTX/A100/H100/etc.
#   docker compose --profile gpu-amd up -d      # MI300X/MI250/etc. (ROCm)
#   docker compose --profile cpu up -d          # sin GPU (lento, solo embeddings)
# Parada:    docker compose down
# Reset DB:  docker compose down -v  (borra volúmenes, aplica migraciones de cero)
#
# Chat LLM se delega al servicio vLLM externo (ver LLM_FLASH_BASE_URL /
# LLM_FLAGSHIP_BASE_URL en .env). Solo embeddings corren en local vía Ollama
# (modelo nomic-embed-text).
#
# Variables en .env (ver .env.example). Puertos expuestos en el host:
#   5173  Frontend (Vue + Vite)
#   8080  Simulation API (FastAPI)
#   3001  Docs (VitePress)
#   54321 Supabase API gateway (Kong)
#   54322 Postgres
#   54323 Supabase Studio (vía Kong también en 54321)
#   5000  OSRM Madrid (Las Rozas, default)
#   5001  OSRM Bogotá
#   5002  OSRM Ciudad de México
#   5003  OSRM Aruba
#   1883  Mosquitto (MQTT)

name: sentinel-digital-twin

services:
  # ───────────────────────────────────────── Infra existente ───
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ──────────────────────── OSRM por región (4 grafos paralelos) ──────
  # Cada región es un trío fetcher → builder → routed. Solo el routed de la
  # región activa recibe queries; los demás quedan idle (~250 MB RAM cada
  # uno). El selector de mapa del frontend conmuta la URL OSRM contra la que
  # rutea el backend, sin reiniciar contenedores.
  #
  # Datos en ./docker/osrm-data/<region>/:
  #   map.osm.pbf  (descargado por fetcher)
  #   region.osrm*  (compilado por builder, leído por routed)

  osrm-fetcher-aruba:
    image: alpine:3.19
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f region.osrm ] || [ -f map.osm.pbf ]; then
          echo "[osrm-fetcher-aruba] datos ya existen, saltando descarga"
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        echo "[osrm-fetcher-aruba] descargando Aruba PBF..."
        curl -L --fail -o map.osm.pbf.part "$$PBF_URL"
        mv map.osm.pbf.part map.osm.pbf
        echo "[osrm-fetcher-aruba] OK"
    environment:
      PBF_URL: ${OSRM_PBF_URL_ARUBA:-https://download.openstreetmap.fr/extracts/central-america/aruba.osm.pbf}
    volumes:
      - ./docker/osrm-data/aruba:/data

  osrm-builder-aruba:
    image: osrm/osrm-backend:latest
    restart: "no"
    depends_on:
      osrm-fetcher-aruba:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f region.osrm ]; then
          echo "[osrm-builder-aruba] grafo ya existe, saltando"
          exit 0
        fi
        echo "[osrm-builder-aruba] osrm-extract..."
        osrm-extract -p /opt/car.lua map.osm.pbf
        echo "[osrm-builder-aruba] osrm-partition..."
        osrm-partition map.osrm
        echo "[osrm-builder-aruba] osrm-customize..."
        osrm-customize map.osrm
        for f in map.osrm*; do mv "$$f" "region.$${f#map.}"; done
        echo "[osrm-builder-aruba] grafo listo"
    volumes:
      - ./docker/osrm-data/aruba:/data

  osrm-aruba:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    depends_on:
      osrm-builder-aruba:
        condition: service_completed_successfully
    ports:
      - "5003:5000"
    volumes:
      - ./docker/osrm-data/aruba:/data:ro
    command: osrm-routed --algorithm mld /data/region.osrm

  osrm-fetcher-madrid:
    image: alpine:3.19
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
