        curl -L --fail -o map.osm.pbf.part "$$PBF_URL"
        mv map.osm.pbf.part map.osm.pbf
        echo "[osrm-fetcher-madrid] OK"
    environment:
      PBF_URL: ${OSRM_PBF_URL_MADRID:-https://download.bbbike.org/osm/bbbike/Madrid/Madrid.osm.pbf}
    volumes:
      - ./docker/osrm-data/madrid:/data

  osrm-builder-madrid:
    image: osrm/osrm-backend:latest
    restart: "no"
    depends_on:
      osrm-fetcher-madrid:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f region.osrm ]; then
          echo "[osrm-builder-madrid] grafo ya existe, saltando"
          exit 0
        fi
        echo "[osrm-builder-madrid] osrm-extract..."
        osrm-extract -p /opt/car.lua map.osm.pbf
        echo "[osrm-builder-madrid] osrm-partition..."
        osrm-partition map.osrm
        echo "[osrm-builder-madrid] osrm-customize..."
        osrm-customize map.osrm
        for f in map.osrm*; do mv "$$f" "region.$${f#map.}"; done
        echo "[osrm-builder-madrid] grafo listo"
    volumes:
      - ./docker/osrm-data/madrid:/data

  osrm-madrid:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    depends_on:
      osrm-builder-madrid:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - ./docker/osrm-data/madrid:/data:ro
    command: osrm-routed --algorithm mld /data/region.osrm

  osrm-fetcher-bogota:
    image: alpine:3.19
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f region.osrm ] || [ -f map.osm.pbf ]; then
          echo "[osrm-fetcher-bogota] datos ya existen, saltando descarga"
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        echo "[osrm-fetcher-bogota] descargando Bogotá PBF..."
        curl -L --fail -o map.osm.pbf.part "$$PBF_URL"
        mv map.osm.pbf.part map.osm.pbf
